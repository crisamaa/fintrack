[project]
name = "fintrack"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "pydantic>=2",
    "beautifulsoup4",
    "playwright",
    "pypdf",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "respx", "pyflakes"]

[tool.setuptools]
packages = ["tracker", "tracker.connectors"]

[tool.setuptools.package-data]
tracker = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
