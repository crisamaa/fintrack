name: Daily run

on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC every day
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# One run at a time; a second run waits instead of cancelling the first.
concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m playwright install --with-deps chromium

      # The step stops after 50 minutes so the commit and deploy steps below still have time inside the
      # 60-minute job limit. Data is saved after every firm, so a stopped run loses nothing.
      - name: Run the tracker
        id: tracker
        continue-on-error: true
        timeout-minutes: 50
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m tracker.daily

      # Always save what the run wrote, even if it failed.
      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: update data $(date -u +%F)"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v6
        if: always()

      - uses: actions/upload-pages-artifact@v5
        if: always()
        with:
          path: site

      # Report the failure after the data is saved; the deploy job still runs because it only needs this job to finish.
      - name: Fail the workflow if the tracker failed
        if: steps.tracker.outcome != 'success'
        run: |
          echo "::error::The tracker run failed (outcome: ${{ steps.tracker.outcome }}). Data was saved and the site deployed."
          exit 1

  deploy:
    needs: run
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
